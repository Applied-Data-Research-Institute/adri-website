<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  <title>ADRI | Contact</title>
  <meta name="description" content="Send Us a Message">
  <meta property="og:site_name" content="ADRI">
  <meta property="og:title" content="ADRI | Contact">
  <meta property="og:description" content="Send Us a Message">
  <meta property="og:type" content="website">
  <link rel="canonical" href="https://applied-data-research-institute.github.io/adri-website/contact/">
  <meta property="og:url" content="https://applied-data-research-institute.github.io/adri-website/contact/">
  <meta property="og:image" content="https://applied-data-research-institute.github.io/adri-website/assets/images/home/home-hero-1.jpg">
  <meta name="twitter:image" content="https://applied-data-research-institute.github.io/adri-website/assets/images/home/home-hero-1.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="../assets/images/logo/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="../"><img src="../assets/images/logo/adri-logo.png" alt="ADRI logo" width="161" height="51"></a>
      <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav">Menu</button>
      <nav class="site-nav" id="site-nav" aria-label="Main">
        <ul>
        <li><a href="../">Home</a></li>
        <li><a href="../about/">About</a></li>
        <li><a href="../projects/">Projects</a></li>
        <li><a href="../news/">News</a></li>
        <li><a href="../contact/" aria-current="page">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main">
    <div class="banner"><img src="../assets/images/banners/contact-banner.jpg" alt=""></div>

    <section class="section">
      <div class="wrap">
        <h1>Contact</h1>
        <p class="lede">Interested in getting in touch?</p>
        <h2>Send Us a Message</h2>

        <form action="https://script.google.com/macros/s/AKfycbx5kDxIHIUz7Aq9xdcdbc2-s8WvIdxTNWegN4tHPLSlu4PW8ikCrEmTJM6ncrsvIiSr/exec" method="POST" data-ajax data-thanks="Thanks for submitting!">
          <input type="hidden" name="form" value="contact">
          <input type="text" name="company" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px">
          <div class="two-up">
            <div class="field">
              <label for="first-name">First Name</label>
              <input id="first-name" type="text" name="first_name" required>
            </div>
            <div class="field">
              <label for="last-name">Last Name</label>
              <input id="last-name" type="text" name="last_name" required>
            </div>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" name="email" required>
          </div>
          <div class="field">
            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>
          </div>
          <button class="btn" type="submit">Send</button>
          <p class="form-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="wrap">
      <a href="../"><img src="../assets/images/logo/adri-logo-combined.png" alt="ADRI" width="94" height="77"></a>
      <p>ADRI, 3223 Avent Ferry Road Ste A0f PMB 120, Raleigh, North Carolina 27606</p>
      <p>&copy; Applied Data Research Institute, Inc. 2022. All Rights Reserved</p>
    </div>
  </footer>

  <script src="../assets/js/site.js"></script>
</body>
</html>
